<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shogun Script</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#76827F',
                        'background-dark': '#02040A',
                        'dark-gray': '#0E1218',
                        'soft-black': '#11161A',
                        accent: '#03050B',
                        brown: '#774936',
                        slate: '#2A2D34',
                        teal: '#012A36',
                    }
                }
            }
        }
    </script>
    <style>
        .bg-movie-single {
            position: fixed;
            inset: 0;
            z-index: 0;
            width: 100vw;
            height: 100vh;
            background: url('/static/background.png') center center / cover no-repeat;
            opacity: 0.90;
            filter: grayscale(0.2) blur(1px) brightness(0.7);
        }
        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            background: rgba(2,4,10,0.7);
        }
        .content {
            position: relative;
            z-index: 20;
        }
    </style>
</head>
<body class="bg-background-dark min-h-screen flex items-center justify-center text-white overflow-hidden">
    <div class="bg-movie-single"></div>
    <div class="bg-overlay"></div>
    <div class="content flex flex-col items-center justify-center w-full h-screen space-y-6">
        <a href="/dashboard"
           class="bg-teal text-white font-bold py-4 px-8 shadow-lg text-2xl transition-all duration-200
                  hover:bg-primary hover:text-accent focus:bg-slate focus:text-primary active:bg-brown active:scale-95
                  outline-none ring-2 ring-teal ring-offset-2 ring-offset-background-dark rounded-none">
            Take me to my dashboard
        </a>
        <div class="flex space-x-4">
            <a href="/login"
               class="bg-primary text-white font-semibold py-3 px-6 shadow transition-all duration-200 text-lg rounded-none
                      hover:bg-brown hover:text-accent focus:bg-slate focus:text-primary active:bg-teal active:scale-95
                      outline-none ring-2 ring-primary ring-offset-2 ring-offset-background-dark">
                Login
            </a>
            <a href="/signup"
               class="bg-brown text-white font-semibold py-3 px-6 shadow transition-all duration-200 text-lg rounded-none
                      hover:bg-primary hover:text-accent focus:bg-slate focus:text-primary active:bg-teal active:scale-95
                      outline-none ring-2 ring-brown ring-offset-2 ring-offset-background-dark">
                Sign Up
            </a>
        </div>
    </div>
</body>
</html>
