<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shogun Script</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#76827F',
                        'background-dark': '#02040A',
                        'dark-gray': '#0E1218',
                        'soft-black': '#11161A',
                        accent: '#03050B',
                        brown: '#774936',
                        slate: '#2A2D34',
                        teal: '#012A36',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background-dark min-h-screen flex items-center justify-center text-white">
    <a href="/dashboard"
       class="bg-primary text-white font-bold py-4 px-8 rounded-xl shadow-lg text-2xl transition-all duration-200
              hover:bg-brown hover:text-accent focus:bg-slate focus:text-primary active:bg-teal active:scale-95
              outline-none ring-2 ring-primary ring-offset-2 ring-offset-background-dark">
        Take me to my dashboard
    </a>

</html>
