<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Shogun Script</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#76827F',
                        brown: '#774936',
                        slate: '#2A2D34',
                        teal: '#012A36',
                        accent: '#03050B',
                        'background-dark': '#02040A',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background-dark min-h-screen flex items-center justify-center text-white">
    <form method="POST" class="bg-slate bg-opacity-80 p-8 rounded-lg shadow-lg w-full max-w-md space-y-6">
        <h2 class="text-2xl font-bold text-center text-primary mb-4">Login</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <ul class="mb-4">
              {% for category, message in messages %}
                <li class="text-{{ 'red-400' if category == 'danger' else 'green-400' }}">{{ message }}</li>
              {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}
        <div>
            <label for="username" class="block mb-2 text-sm font-medium">Username</label>
            <input type="text" id="username" name="username" required class="w-full px-4 py-2 rounded-none bg-background-dark text-white border border-primary focus:outline-none focus:ring-2 focus:ring-primary" />
        </div>
        <div>
            <label for="password" class="block mb-2 text-sm font-medium">Password</label>
            <input type="password" id="password" name="password" required class="w-full px-4 py-2 rounded-none bg-background-dark text-white border border-primary focus:outline-none focus:ring-2 focus:ring-primary" />
        </div>
        <button type="submit" class="w-full bg-teal text-white font-bold py-3 mt-2 rounded-none shadow hover:bg-primary transition-all">Login</button>
        <p class="text-center text-sm mt-4">Don't have an account? <a href="/signup" class="text-primary underline hover:text-brown">Sign Up</a></p>
    </form>
</body>
</html>
